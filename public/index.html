<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Bitstrips Classic</title>
<style>
:root {
  --bg: #e8eef5;
  --panel: #f5f7fa;
  --border: #d0d7de;
  --text: #1a1a1a;
  --muted: #5a6a7a;
  --accent: #e67e22;
  --accent2: #3498db;
  --header: #2c3e50;
}
* { margin:0; padding:0; box-sizing:border-box; }
body { font-family: system-ui, -apple-system, sans-serif; background:var(--bg); color:var(--text); height:100vh; display:flex; flex-direction:column; overflow:hidden; }
header { background:var(--header); color:#fff; padding:10px 16px; display:flex; align-items:center; gap:12px; flex-shrink:0; }
header h1 { font-size:1.15rem; font-weight:600; }
.badge { background:var(--accent); font-size:.65rem; padding:2px 8px; border-radius:4px; font-weight:700; }
.tabs { margin-left:auto; display:flex; gap:4px; }
.tabs button { background:transparent; border:1px solid rgba(255,255,255,.3); color:#fff; padding:6px 14px; border-radius:6px; cursor:pointer; font-size:.85rem; }
.tabs button.active { background:var(--accent); border-color:var(--accent); }
.main { display:flex; flex:1; overflow:hidden; }
.sidebar { width:280px; background:var(--panel); border-right:1px solid var(--border); padding:12px; overflow-y:auto; flex-shrink:0; }
.sidebar h2 { font-size:.72rem; text-transform:uppercase; letter-spacing:.06em; color:var(--muted); margin:14px 0 6px; }
.sidebar h2:first-child { margin-top:0; }
label { display:block; font-size:.78rem; margin-bottom:3px; color:#444; }
select, button, input[type=color], input[type=text], input[type=range] {
  width:100%; padding:7px 9px; border:1px solid var(--border); border-radius:6px; background:#fff; font-size:.85rem; margin-bottom:6px;
}
button { background:var(--accent); color:#fff; border:none; font-weight:600; cursor:pointer; transition:background .15s; }
button:hover { background:#d35400; }
button.secondary { background:var(--accent2); }
button.secondary:hover { background:#2980b9; }
button.ghost { background:transparent; color:var(--header); border:1px solid var(--border); }
button.ghost:hover { background:#e8eef5; }
.row { display:flex; gap:6px; } .row>* { flex:1; }
.swatches { display:flex; flex-wrap:wrap; gap:4px; margin-bottom:8px; }
.swatch { width:24px; height:24px; border-radius:4px; border:2px solid transparent; cursor:pointer; }
.swatch.active, .swatch:hover { border-color:#333; }
.preview { flex:1; display:flex; flex-direction:column; background:#fff; position:relative; overflow:hidden; }
.canvas-wrap { flex:1; display:flex; align-items:center; justify-content:center; overflow:auto; padding:16px; background:#f0f4f8; }
canvas { background:#fff; border:2px solid var(--border); border-radius:8px; box-shadow:0 4px 20px rgba(0,0,0,.08); cursor:default; }
canvas.draggable { cursor:grab; }
canvas.dragging { cursor:grabbing; }
.status { position:absolute; bottom:10px; left:14px; font-size:.72rem; color:#888; pointer-events:none; }
.toolbar { display:flex; gap:8px; padding:8px 12px; border-top:1px solid var(--border); background:var(--panel); flex-shrink:0; align-items:center; }
.toolbar span { font-size:.8rem; color:var(--muted); margin-right:auto; }
.hidden { display:none !important; }
.panel-list { display:flex; flex-direction:column; gap:4px; margin-bottom:8px; }
.panel-item { padding:6px 8px; border:1px solid var(--border); border-radius:6px; cursor:pointer; font-size:.8rem; background:#fff; }
.panel-item.active { border-color:var(--accent); background:#fff5eb; }
</style>
</head>
<body>
<header>
  <h1>Bitstrips Classic</h1>
  <span class="badge">APP</span>
  <div class="tabs">
    <button id="tabChar" class="active">Personagem</button>
    <button id="tabComic">Tirinha</button>
  </div>
</header>
<div class="main">
  <aside class="sidebar" id="sideChar">
    <h2>Personagem</h2>
    <label>Nome</label>
    <input type="text" id="avName" value="Meu Avatar" />
    <label>Gênero</label>
    <select id="gender">
      <option value="male">Masculino</option>
      <option value="female">Feminino</option>
      <option value="neutral" selected>Neutro</option>
    </select>
    <h2>Pele</h2>
    <div class="swatches" id="skinSwatches"></div>
    <h2>Cabelo</h2>
    <label>Estilo</label>
    <select id="hairStyle">
      <option value="short">Curto</option>
      <option value="medium">Médio</option>
      <option value="long">Longo</option>
      <option value="spiky">Espetado</option>
      <option value="curly">Cacheado</option>
    </select>
    <label>Cor</label>
    <div class="swatches" id="hairSwatches"></div>
    <input type="color" id="hairColor" value="#2C1E1E" />
    <h2>Roupa</h2>
    <label>Top</label>
    <select id="topStyle">
      <option value="tshirt">T-Shirt</option>
      <option value="hoodie">Hoodie</option>
      <option value="collar">Camisa</option>
      <option value="dress">Vestido</option>
    </select>
    <label>Cor</label>
    <input type="color" id="shirtColor" value="#4A90D9" />
    <label>Bottom</label>
    <select id="bottomStyle">
      <option value="pants">Calça</option>
      <option value="jeans">Jeans</option>
      <option value="skirt">Saia</option>
    </select>
    <h2>Acessórios</h2>
    <label>Óculos</label>
    <select id="glasses">
      <option value="none">Nenhum</option>
      <option value="round">Redondo</option>
      <option value="rect">Retangular</option>
    </select>
    <label>Chapéu</label>
    <select id="hat">
      <option value="none">Nenhum</option>
      <option value="cap">Boné</option>
      <option value="beanie">Gorro</option>
    </select>
    <h2>Expressão</h2>
    <select id="expression">
      <option value="neutral">Neutro</option>
      <option value="happy">Feliz</option>
      <option value="grin">Sorriso</option>
      <option value="sad">Triste</option>
      <option value="surprised">Surpreso</option>
      <option value="angry">Bravo</option>
    </select>
    <h2>Ações</h2>
    <div class="row">
      <button id="btnRandom">Aleatório</button>
      <button id="btnSaveAv" class="secondary">Salvar</button>
    </div>
    <div class="row">
      <button id="btnLoadAv" class="ghost">Carregar</button>
      <button id="btnPngAv" class="ghost">PNG</button>
    </div>
  </aside>
  <aside class="sidebar hidden" id="sideComic">
    <h2>Tirinha</h2>
    <label>Título</label>
    <input type="text" id="comicTitle" value="Minha Tirinha" />
    <h2>Painéis</h2>
    <div class="panel-list" id="panelList"></div>
    <div class="row">
      <button id="btnAddPanel">+ Painel</button>
      <button id="btnDelPanel" class="ghost">Remover</button>
    </div>
    <h2>Balão</h2>
    <label>Texto</label>
    <input type="text" id="balloonText" value="Olá!" />
    <label>Tipo</label>
    <select id="balloonType">
      <option value="speech">Fala</option>
      <option value="thought">Pensamento</option>
      <option value="shout">Grito</option>
      <option value="whisper">Sussurro</option>
    </select>
    <button id="btnAddBalloon">+ Adicionar Balão</button>
    <p style="font-size:.72rem;color:var(--muted);margin:6px 0 10px">Arraste balões no canvas para posicionar.</p>
    <h2>Expressão no painel</h2>
    <select id="panelExpr">
      <option value="neutral">Neutro</option>
      <option value="happy">Feliz</option>
      <option value="grin">Sorriso</option>
      <option value="sad">Triste</option>
      <option value="surprised">Surpreso</option>
      <option value="angry">Bravo</option>
    </select>
    <h2>Ações</h2>
    <button id="btnExportComic" class="secondary">Exportar Tirinha PNG</button>
    <button id="btnSaveComic" class="ghost">Salvar Tirinha</button>
    <button id="btnLoadComic" class="ghost">Carregar Tirinha</button>
  </aside>
  <section class="preview">
    <div class="canvas-wrap">
      <canvas id="stage" width="400" height="560"></canvas>
    </div>
    <div class="toolbar">
      <span id="status">Pronto</span>
      <button id="btnClearBalloons" class="ghost" style="width:auto;padding:6px 12px">Limpar balões</button>
    </div>
  </section>
</div>
<script src="app-assets.js"></script>
<script src="app-render.js"></script>
<script src="app-ui.js"></script>
</body>
</html>
